[project]
name = "reliclab-core"
version = "0.1.0a1"
description = "Composable agent identity assets and context."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.11,<3", "semver>=3.0,<4", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]


[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliclab"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/LICENSE"]
